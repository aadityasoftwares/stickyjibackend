name: Sticky Ji Backend Docker Build

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: 'Build target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi

          if [ "$ENV" = "production" ]; then
            TAGS="ghcr.io/aadityasoftwares/stickyjibackend:latest,ghcr.io/aadityasoftwares/stickyjibackend:production,ghcr.io/aadityasoftwares/stickyjibackend:${{ github.sha }}"
          else
            TAGS="ghcr.io/aadityasoftwares/stickyjibackend:develop,ghcr.io/aadityasoftwares/stickyjibackend:staging,ghcr.io/aadityasoftwares/stickyjibackend:${{ github.sha }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}